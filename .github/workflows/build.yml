name: Build macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write # タグ push 時に Release を作成するため
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" macOS/Info.plist

      - name: Build .dmg
        run: ./macOS/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CodeQuotaTray-macOS
          path: macOS/dist/*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" macOS/dist/*.dmg --title "$GITHUB_REF_NAME" --generate-notes
